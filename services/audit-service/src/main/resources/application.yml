server:
  port: ${PORT:8082}

spring:
  application:
    name: audit-service
  datasource:
    # One MySQL server, one schema per service (Dev Principle 4). The schema is this service's alone.
    url: ${DB_URL:jdbc:mysql://localhost:3306/audit?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:myclawd}
    password: ${DB_PASSWORD:myclawd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/audit/v3/api-docs
  swagger-ui:
    path: /api/audit/swagger-ui.html

myclawd:
  audit:
    relay-enabled: false   # this IS the audit service
